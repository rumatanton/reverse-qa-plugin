# Manual only: the three subagents run headless on the mini-shop fixture and code checks what they wrote (planted
# facts found, every citation resolves, schema valid). Uses model tokens, so it needs an ANTHROPIC_API_KEY secret.
name: agent-behavior
on:
  workflow_dispatch:

jobs:
  behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RQA_BEHAVIOR: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm, cache-dependency-path: plugin/package-lock.json }
      - run: npm ci && npm i -g @anthropic-ai/claude-code
        working-directory: plugin
      - name: Agent behavior tests
        run: node --test --test-timeout=3000000 "tests/behavior/**/*.test.mjs"
        working-directory: plugin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: agent-behavior, path: plugin/tests/behavior/.runs/ }
