<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mini Desktop - Admin</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js"></script>
</head>
<body>
  <nav id="menu" aria-label="Main"></nav>
  <main>
    <h1>Admin</h1>
    <p id="count"></p>
    <script>
      requireRole("Admin");
      window.desk.notes().then((notes) => { document.getElementById("count").textContent = notes.length + " note(s) stored"; });
    </script>
  </main>
</body>
</html>
