<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mini Desktop - Sign in</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js"></script>
</head>
<body>
  <nav id="menu" aria-label="Main"></nav>
  <main>
    <h1>Sign in</h1>
    <form id="login">
      <label>Email <input name="email" type="email" required></label>
      <label>Password <input name="password" type="password" required></label>
      <button type="submit">Sign in</button>
    </form>
    <p id="error" role="alert"></p>
    <script>
      document.getElementById("login").addEventListener("submit", (event) => {
        event.preventDefault();
        const form = event.target;
        if (!signIn(form.email.value, form.password.value)) {
          document.getElementById("error").textContent = "Wrong email or password";
          return;
        }
        location.href = session().role === "Admin" ? "admin.html" : "notes.html";
      });
    </script>
  </main>
</body>
</html>
