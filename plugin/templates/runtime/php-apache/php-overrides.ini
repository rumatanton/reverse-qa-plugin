; reverse-qa overrides on top of php.ini-development

; Users see what production users would see; every warning still goes to the log, which the tests read.
display_errors = Off
log_errors = On
error_log = /var/log/php/error.log
error_reporting = E_ALL

; Apps that connect to "localhost" reach MySQL/MariaDB over this Unix socket (shared from the db container).
mysqli.default_socket = /var/run/mysqld/mysqld.sock

; Match a XAMPP-style upload limit so admin uploads behave as the app's author saw them.
upload_max_filesize = 40M
post_max_size = 40M

date.timezone = UTC
